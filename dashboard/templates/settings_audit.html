{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto py-8">
    <h2 class="text-2xl font-bold mb-4 text-primary">Settings Audit Log</h2>
    <div class="bg-gray-900 rounded-lg shadow p-4">
        <table class="min-w-full divide-y divide-gray-700">
            <thead>
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Timestamp</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Setting</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Old → New</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Actor</th>
                </tr>
            </thead>
            <tbody id="auditLogTable" class="divide-y divide-gray-800 text-sm text-gray-200">
                <!-- Rows will be populated by JS -->
            </tbody>
        </table>
        <div id="auditLogEmpty" class="text-center text-gray-500 py-8 hidden">
            No audit log entries found.
        </div>
    </div>
</div>
<script>
async function fetchAuditLog() {
    const res = await fetch('/api/settings_audit');
    const data = await res.json();
    const table = document.getElementById('auditLogTable');
    const empty = document.getElementById('auditLogEmpty');
    table.innerHTML = '';
    if (!data.entries || !data.entries.length) {
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');
    for (const entry of data.entries) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-4 py-2 whitespace-nowrap">${entry.changed_at}</td>
            <td class="px-4 py-2 whitespace-nowrap">${entry.field}</td>
            <td class="px-4 py-2 whitespace-nowrap"><span class="text-red-400">${entry.old_value}</span> &rarr; <span class="text-green-400">${entry.new_value}</span></td>
            <td class="px-4 py-2 whitespace-nowrap">${entry.changed_by || 'system'}</td>
        `;
        table.appendChild(row);
    }
}
document.addEventListener('DOMContentLoaded', fetchAuditLog);
</script>
{% endblock %}
